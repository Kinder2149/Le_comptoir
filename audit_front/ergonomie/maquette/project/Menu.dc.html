<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu par familles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.p{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid #EFE7DA;min-height:48px}
.pastille{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.prix{font-weight:700;font-size:15px}
.type{font-size:12px;color:#5d6168}
.famille{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-weight:700;font-size:15px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4EFE6;font-family:Roboto,system-ui,sans-serif;color:#2F343C;display:flex;flex-direction:column">
  <header style="background:#2F343C;color:#fff;padding:18px 16px 12px">
    <div style="display:flex;align-items:center;gap:12px">
      <button aria-label="Retour" style="background:none;border:0;color:#fff;width:40px;height:40px;padding:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="flex:1"><div style="font-size:12px;color:#D9B06F">Catalogue · 27 produits</div><div style="font-size:20px;font-weight:700">Menu buvette 2026</div></div>
    </div>
  </header>

  <div style="padding:12px 16px 4px">
    <label style="display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:#FFFDF8;border:1px solid #CDBFA8;padding:0 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6168" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Chercher un produit" placeholder="Chercher un produit" style="border:0;background:transparent;font:400 15px Roboto;flex:1;outline:none;color:#2F343C">
    </label>
  </div>

  <main style="flex:1;overflow:hidden;padding:8px 16px;display:flex;flex-direction:column;gap:10px">
    <section style="background:#FFFDF8;border:1px solid #E3DACB;border-radius:16px;overflow:hidden">
      <div class="famille"><span style="width:10px;height:10px;border-radius:50%;background:#D9B06F"></span><span style="flex:1">Croques</span><span style="font-weight:500;font-size:13px;color:#5d6168">3</span></div>
      <div class="p"><span class="pastille" style="background:#B98A3E">CM</span><span style="flex:1"><span style="display:block;font-weight:500">Croque-monsieur</span><span class="type">Recette · 4 ingrédients</span></span><span class="prix">1,00 €</span></div>
      <div class="p"><span class="pastille" style="background:#B98A3E">CV</span><span style="flex:1"><span style="display:block;font-weight:500">Croque végé</span><span class="type">Recette · 4 ingrédients</span></span><span class="prix">1,00 €</span></div>
    </section>
    <section style="background:#FFFDF8;border:1px solid #E3DACB;border-radius:16px;overflow:hidden">
      <div class="famille"><span style="width:10px;height:10px;border-radius:50%;background:#A04467"></span><span style="flex:1">Boissons fraîches</span><span style="font-weight:500;font-size:13px;color:#5d6168">7</span></div>
      <div class="p"><span class="pastille" style="background:#A04467">Co</span><span style="flex:1"><span style="display:block;font-weight:500">Coca</span><span class="type">Au verre · 4 par litre</span></span><span class="prix">1,00 €</span></div>
      <div class="p"><span class="pastille" style="background:#A04467">Bi</span><span style="flex:1"><span style="display:block;font-weight:500">Bière</span><span class="type">Au verre · 4 par litre</span></span><span class="prix">2,00 €</span></div>
    </section>
    <section style="background:#FFFDF8;border:1px solid #E3DACB;border-radius:16px">
      <div class="famille"><span style="width:10px;height:10px;border-radius:50%;background:#9A670F"></span><span style="flex:1">Boissons chaudes</span><span style="font-weight:500;font-size:13px;color:#5d6168">2</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6168" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
    </section>
    <section style="background:#FFFDF8;border:1px solid #E3DACB;border-radius:16px">
      <div class="famille"><span style="width:10px;height:10px;border-radius:50%;background:#5A7D4F"></span><span style="flex:1">Snacks et fruits</span><span style="font-weight:500;font-size:13px;color:#5d6168">7</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6168" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
    </section>
    <section style="background:#FFFDF8;border:1px solid #E3DACB;border-radius:16px">
      <div class="famille"><span style="width:10px;height:10px;border-radius:50%;background:#6C4F86"></span><span style="flex:1">Fait maison (bénévoles)</span><span style="font-weight:500;font-size:13px;color:#5d6168">7</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6168" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
    </section>
  </main>

  <footer style="padding:12px 16px 20px;border-top:1px solid #E3DACB;display:flex;gap:10px">
    <button style="flex:1;height:52px;border-radius:14px;border:1px solid #6C4F86;background:transparent;color:#6C4F86;font:700 14px Roboto">Importer d'Excel</button>
    <button style="flex:1;height:52px;border-radius:14px;border:0;background:#6C4F86;color:#fff;font:700 15px Roboto">+ Produit</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
